<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Catalogue — BrandSeoTools</title>
<script>if(localStorage.getItem("bst-theme")!=="\"light\"")document.documentElement.classList.add("dark")</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="products" data-title="Tool Catalogue">
<main id="page">
  <div class="page-head">
    <div><h1>Tool Catalogue</h1><p class="sub"><span id="pcount"></span> · every tool is a 30-day subscription</p></div>
    <div class="page-head-actions"><button class="btn btn-secondary" id="req-tool">Request a tool</button></div>
  </div>

  <div class="toolbar">
    <div class="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="pq" type="search" placeholder="Search tools, categories…" aria-label="Search tools"></div>
    <select class="select" id="psort" aria-label="Sort tools">
      <option value="name">Name A–Z</option>
      <option value="popular">Most popular</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
    </select>
    <span class="grow"></span>
    <span class="filter-wrap">
      <button class="chip" id="filter-btn" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M2 5h20"/><path d="M6 12h12"/><path d="M9 19h6"/></svg>Filters<span class="cnt" id="filter-cnt" style="display:none"></span></button>
      <div class="filter-pop" id="filter-pop">
        <h5>Price</h5>
        <label><input type="radio" name="fprice" value="all" checked>All prices</label>
        <label><input type="radio" name="fprice" value="low">Under ₹100</label>
        <label><input type="radio" name="fprice" value="mid">₹100 – ₹249</label>
        <label><input type="radio" name="fprice" value="high">₹250+</label>
        <h5>Access</h5>
        <label><input type="radio" name="faccess" value="all" checked>Any method</label>
        <label><input type="radio" name="faccess" value="extension">Extension</label>
        <label><input type="radio" name="faccess" value="cloud">Cloud only</label>
      </div>
    </span>
    <span class="view-toggle" role="group" aria-label="View">
      <button data-view="grid" class="on" aria-label="Grid view"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button>
      <button data-view="list" aria-label="List view"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </span>
    <button class="chip on" data-quick="all">All</button>
    <button class="chip" data-quick="owned">My tools</button>
    <button class="chip" data-quick="fav">Favorites</button>
  </div>

  <div class="chip-row" id="cat-chips" style="margin-bottom:18px"></div>
  <div class="prod-grid" id="pgrid"></div>
</main>
<script src="assets/js/icons.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/product-images.js"></script><script src="assets/js/app.js"></script>
</body>
</html>
